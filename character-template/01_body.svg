<?xml version="1.0" encoding="UTF-8"?>
<!--
  01 体・ユニフォーム

  描くもの      肩 / 胴体 / ユニフォーム / 襟 / ボタンなどの衣服
  描かないもの  首 / 顔 / 耳 / 髪 / 帽子 / 目 / 眉 / 鼻 / 口

  目安の範囲    x 16〜240 / y 236〜320
  見る基準線    SHOULDER_LINE = 262
  中心          CENTER_X = 128

  決まりごと
    ・viewBox は "0 0 256 320" のまま変えない
    ・背景を描かない（透明のまま）
    ・下の <g> の **中** に描く
    ・位置は自分で合わせる。あとから自動で寄せたり縮めたりはしません（§13）

  このファイルには絵が入っていません。中身はあなたが描きます。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320">
  <g id="layer-01-body" data-layer="01_body">

    <!-- ここに描く -->

  </g>
</svg>
