<!--
  04 顔の輪郭

  描くもの      顔の輪郭 / あご / 頬 / こめかみ
  描かないもの  目 / 眉 / 鼻 / 口 / 耳 / 髪 / 帽子 / 首
  memo          **最重要**。頭の左右幅・耳位置・髪位置・帽子位置は、すべてここを基準に決める

  目安の範囲    x 58〜198 / y 44〜207
  見る基準線    HEAD_TOP = 44 / BROW_LINE = 110 / EYE_LINE = 125 / NOSE_LINE = 152 / MOUTH_LINE = 177 / CHIN_LINE = 207
  中心          CENTER_X = 128

  決まりごと
    ・viewBox は "0 0 256 320" のまま変えない
    ・背景を描かない（透明のまま）
    ・下の <g> の **中** に描く
    ・位置は自分で合わせる。あとから自動で寄せたり縮めたりはしません（§13）

  このファイルには絵が入っていません。中身はあなたが描きます。
