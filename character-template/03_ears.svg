<!--
  03 耳

  描くもの      左耳 / 右耳
  描かないもの  顔の輪郭 / 髪
  memo          肌色。顔の輪郭との接続位置を基準にする

  目安の範囲    x 48〜208 / y 112〜170
  見る基準線    EYE_LINE = 125 / NOSE_LINE = 152
  中心          CENTER_X = 128

  決まりごと
    ・viewBox は "0 0 256 320" のまま変えない
    ・背景を描かない（透明のまま）
    ・下の <g> の **中** に描く
    ・位置は自分で合わせる。あとから自動で寄せたり縮めたりはしません（§13）

  このファイルには絵が入っていません。中身はあなたが描きます。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320">
  <g id="layer-03-ears" data-layer="03_ears">
    <path d="M 74 112 C 48 111, 38 136, 47 158 C 55 174, 70 176, 80 166 Z"
          fill="#f7d7ae" stroke="#1a1a1a" stroke-width="4.5"
          stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <path d="M 182 112 C 208 111, 218 136, 209 158 C 201 174, 186 176, 176 166 Z"
          fill="#f7d7ae" stroke="#1a1a1a" stroke-width="4.5"
          stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </g>
</svg>
