<!--
  11 帽子

  描くもの      帽子本体 / つば
  描かないもの  顔 / 髪 / 耳
  memo          帽子を変えても顔の座標が動かないようにする

  目安の範囲    x 40〜216 / y 10〜130
  見る基準線    HEAD_TOP = 44 / BROW_LINE = 110
  中心          CENTER_X = 128

  決まりごと
    ・viewBox は "0 0 256 320" のまま変えない
    ・背景を描かない（透明のまま）
    ・下の <g> の **中** に描く
    ・位置は自分で合わせる。あとから自動で寄せたり縮めたりはしません（§13）

  このファイルには絵が入っていません。中身はあなたが描きます。
-->
