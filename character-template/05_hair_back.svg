  目安の範囲    x 50〜206 / y 36〜230
  見る基準線    HEAD_TOP = 44 / CHIN_LINE = 207 / NECK_LINE = 227
  中心          CENTER_X = 128

  決まりごと
    ・viewBox は "0 0 256 320" のまま変えない
    ・背景を描かない（透明のまま）
    ・下の <g> の **中** に描く
    ・位置は自分で合わせる。あとから自動で寄せたり縮めたりはしません（§13）

  このファイルには絵が入っていません。中身はあなたが描きます。
-->
